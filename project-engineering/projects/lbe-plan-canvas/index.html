<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LBE Plan Canvas</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#171717;background:#f4f1ea}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#fff 0,#f4f1ea 36%,#e9e4da 100%)}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:18px 28px;background:#f4f1eadd;backdrop-filter:blur(14px);border-bottom:1px solid #cfc8bb}.brand{font-weight:800;letter-spacing:-.04em;font-size:24px}.sub{font-size:12px;color:#6f6a61}.toolbar{display:flex;gap:8px}button{border:1px solid #bdb5a8;background:#fffaf2;border-radius:999px;padding:8px 12px;cursor:pointer}main{padding:30px;overflow:auto}.legend{display:flex;gap:18px;align-items:center;margin-bottom:22px;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.proven{background:#275d4b}.current{background:#e16c3a}.next{background:#b88b22}.planned{background:#8d8a84}.board{min-width:1180px;display:grid;grid-template-columns:repeat(9,190px);gap:34px;align-items:center;position:relative;padding:50px 20px 100px}.node{position:relative;min-height:155px;border:1px solid #bdb5a8;background:#fffaf2;border-radius:22px;padding:18px;box-shadow:0 8px 30px #4d443b12;cursor:pointer;transition:.2s}.node:hover{transform:translateY(-4px);box-shadow:0 14px 38px #4d443b20}.node.current-node{outline:3px solid #e16c3a;outline-offset:4px}.node.current-node:before{content:'YOU ARE HERE';position:absolute;top:-29px;left:8px;font-size:10px;font-weight:800;letter-spacing:.12em;color:#b84217}.lane{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#827b70}.node h2{font-size:17px;line-height:1.1;margin:9px 0}.node p{font-size:12px;line-height:1.45;color:#5d5850;margin:0}.state{position:absolute;bottom:14px;left:18px;font-size:10px;font-weight:800;text-transform:uppercase}.arrow{position:absolute;right:-29px;top:72px;font-size:24px;color:#9a9388}.panel{position:fixed;right:22px;bottom:22px;width:min(390px,calc(100vw - 44px));max-height:70vh;overflow:auto;background:#171717;color:#f7f2e8;border-radius:24px;padding:22px;box-shadow:0 24px 70px #0005;display:none;z-index:10}.panel.open{display:block}.panel h3{margin:0 0 7px}.panel p,.panel li{font-size:13px;line-height:1.5;color:#d5cec3}.panel .close{float:right;background:#2b2b2b;color:#fff;border-color:#444}.note{margin-top:14px;padding:12px;border:1px dashed #5d5d5d;border-radius:12px}.pin{position:absolute;right:14px;top:13px;font-size:16px}.footer{padding:0 30px 35px;color:#746e65;font-size:11px}@media(max-width:700px){header{padding:14px 16px}main{padding:18px}.board{transform-origin:top left}.brand{font-size:20px}}
</style></head><body><header><div><div class="brand">LBE · Plan Canvas</div><div class="sub">Shared navigation map — evidence outranks the canvas</div></div><div class="toolbar"><button onclick="location.reload()">Refresh state</button><button onclick="showRefs()">References</button></div></header><main><div class="legend"><span><i class="dot proven"></i>Proven</span><span><i class="dot current"></i>Current</span><span><i class="dot next"></i>Next</span><span><i class="dot planned"></i>Planned</span></div><div id="board" class="board"></div></main><div class="footer">Click a card for detail. Pinning is a visual marker only; repository evidence remains authoritative.</div><aside id="panel" class="panel"><button class="close" onclick="panel.classList.remove('open')">Close</button><div id="panelBody"></div></aside><script>
const fallback={project:'LBE Persistent Agent',active_node:'release-2.0.3',nodes:[{id:'vision',lane:'Foundation',title:'Vision & architecture',status:'proven',summary:'Persistent governed agent runtime; LBE owns authority, providers reason.'},{id:'r3-r6',lane:'Core Runtime',title:'R3–R6F core contracts',status:'proven',summary:'Accepted constituent runtime, authorization, governed execution and receipt contracts.'},{id:'cli',lane:'Interface',title:'CLI control plane',status:'proven',summary:'Persistent runtime command surface.'},{id:'r7-compose',lane:'Installed Acceptance',title:'Installed coding composition',status:'proven',summary:'Governed execution and receipt-backed continuation.'},{id:'r7-close',lane:'Installed Acceptance',title:'R7 closure',status:'proven',summary:'Installed/runtime acceptance closure.'},{id:'release-harness',lane:'Release',title:'Release harness repair',status:'proven',summary:'Isolated PyPA build path validated.'},{id:'release-2.0.3',lane:'Release',title:'PyPI 2.0.3',status:'current',summary:'Published and clean-install verified.'},{id:'public-install',lane:'Distribution',title:'Public install path',status:'next',summary:'Validate public-user command precedence and onboarding.'},{id:'product-surface',lane:'Product',title:'Product surface / UI',status:'planned',summary:'Continue from canonical product plan; do not infer completion from CLI/TUI.'}]};let data=fallback,refs=[];const panel=document.getElementById('panel'),body=document.getElementById('panelBody');
async function load(){try{data=await fetch('./plan.json?'+Date.now()).then(r=>r.ok?r.json():Promise.reject());}catch(e){}try{refs=(await fetch('./references.json?'+Date.now()).then(r=>r.json())).references||[]}catch(e){}render()}
function render(){const b=document.getElementById('board');b.innerHTML='';data.nodes.forEach((n,i)=>{const el=document.createElement('article');el.className='node '+(n.id===data.active_node?'current-node':'');el.innerHTML=`<span class="pin">${n.id===data.active_node?'●':'○'}</span><div class="lane">${n.lane}</div><h2>${n.title}</h2><p>${n.summary}</p><div class="state" style="color:${n.status==='proven'?'#275d4b':n.status==='current'?'#c64d1c':n.status==='next'?'#8d6812':'#777'}">${n.status}</div>${i<data.nodes.length-1?'<span class="arrow">→</span>':''}`;el.onclick=()=>openNode(n);b.appendChild(el)})}
function openNode(n){body.innerHTML=`<div class="lane">${n.lane}</div><h3>${n.title}</h3><p>${n.summary}</p><div class="note"><b>Status:</b> ${n.status}<br><b>ID:</b> ${n.id}</div><p>Use this node ID when telling an agent where work should remain anchored.</p>`;panel.classList.add('open')}
function showRefs(){body.innerHTML='<h3>Attached references</h3>'+(refs.length?'<ul>'+refs.map(r=>`<li>${r.label} <small>(${r.kind})</small></li>`).join('')+'</ul>':'<p>Open references.json beside this canvas.</p>');panel.classList.add('open')}load();
</script></body></html>
