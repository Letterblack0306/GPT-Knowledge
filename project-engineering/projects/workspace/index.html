<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letterblack Project Workspace</title>
<style>
:root{--bg:#080a0e;--panel:#0d1117;--panel2:#121821;--line:#222b37;--text:#eef3f8;--muted:#778392;--blue:#7da9ff;--green:#65d29a;--amber:#f0bd63}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.4 Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;height:100%}.side{border-right:1px solid var(--line);background:#090c11;padding:18px 14px;display:flex;flex-direction:column}.brand{padding:8px 10px 18px}.brand b{font-size:15px;letter-spacing:.08em}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.project-list{display:flex;flex-direction:column;gap:7px}.project{border:1px solid transparent;background:transparent;color:#aeb8c4;border-radius:10px;padding:11px;text-align:left;cursor:pointer}.project:hover{background:#0f141b}.project.active{background:#121923;border-color:#2d3a4b;color:#fff}.project small{display:block;color:#667384;margin-top:3px}.side-foot{margin-top:auto;color:#526071;font-size:10px;padding:10px}.main{position:relative;overflow:hidden}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0a0d12}.title b{font-size:17px}.title span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.top-right{display:flex;align-items:center;gap:8px}.badge,.counter{border:1px solid #283240;border-radius:999px;padding:5px 8px;color:#778392;font-size:10px}.top-action{border:1px solid #283442;background:#111721;color:#9eabba;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:10px}.top-action:hover{border-color:#52647a;color:#fff}.canvas{position:absolute;left:0;right:0;top:70px;bottom:0;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(circle at 50% 42%,#111927 0,transparent 34%),linear-gradient(#0b0f14 1px,transparent 1px),linear-gradient(90deg,#0b0f14 1px,transparent 1px);background-size:auto,42px 42px,42px 42px}.canvas.dragging{cursor:grabbing}.board{position:absolute;left:0;top:0;width:1450px;min-height:820px;padding:82px 60px 110px;transform-origin:0 0;will-change:transform}.lanes{display:flex;gap:18px;align-items:stretch;flex-wrap:wrap;position:relative;z-index:2}.lane{min-width:250px;max-width:390px;flex:1 1 280px;border:1px solid #171e28;border-radius:22px;background:#0b0f1536;padding:18px 16px 22px}.lane-label{color:#445061;font-size:9px;letter-spacing:.16em;font-weight:800;margin:0 4px 16px;text-transform:uppercase}.lane-nodes{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.node{width:122px;height:122px;border-radius:50%;border:1px solid #303948;background:#0e131a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 12px 35px #0007;position:relative;cursor:pointer;user-select:none;transition:.15s}.node:hover{transform:scale(1.04);border-color:#607086}.node .id{font-size:9px;color:#6b7889;font-weight:700;letter-spacing:.08em}.node .name{font-size:11px;font-weight:650;margin-top:5px;max-width:94px}.node.proven{border-color:#35634e;background:#0f1714}.node.current{border-color:var(--blue);box-shadow:0 0 0 5px #7da9ff12,0 12px 35px #0007}.node.current:before{content:'YOU ARE HERE';position:absolute;top:-25px;font-size:8px;font-weight:800;letter-spacing:.1em;color:var(--blue)}.node.next{border-color:#6b5530}.node.local-done:after{content:'✓';position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#07110b;display:grid;place-items:center;font-weight:900}.node.pinned{box-shadow:0 0 0 5px #f0bd6314,0 12px 35px #0007}.node.pinned .pin-dot{position:absolute;left:2px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--amber);color:#231700;display:grid;place-items:center;font-size:9px}.empty{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;color:var(--muted)}.empty b{display:block;color:#cbd3dc;font-size:18px;margin-bottom:6px}.ref{position:absolute;right:22px;top:92px;background:#0c1118e8;border:1px solid #283240;border-radius:12px;padding:10px 12px;color:#8b98a8;font-size:11px;max-width:320px;z-index:10}.ref a{color:#8db7ff}.view-controls{position:absolute;left:18px;bottom:18px;z-index:20;display:flex;align-items:center;gap:6px;padding:6px;background:#0a0e14dd;border:1px solid #25303d;border-radius:12px;backdrop-filter:blur(10px)}.view-controls button{width:32px;height:30px;border:1px solid #283442;background:#111721;color:#b8c5d4;border-radius:8px;cursor:pointer}.view-controls button:hover{border-color:#52647a;color:#fff}.zoom-label{min-width:46px;text-align:center;color:#7f8b99;font-size:10px;font-weight:700}.view-hint{position:absolute;left:50%;bottom:21px;transform:translateX(-50%);z-index:19;color:#566273;font-size:10px;pointer-events:none;background:#090d13b8;border:1px solid #1d2530;border-radius:999px;padding:5px 9px}.drawer{position:absolute;right:22px;top:92px;width:320px;background:#0c1118f2;border:1px solid #283241;border-radius:16px;padding:18px;box-shadow:0 24px 70px #000a;backdrop-filter:blur(18px);display:none;z-index:30}.drawer.open{display:block}.drawer .close{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;border:1px solid #293241;background:#0e131b;color:#b8c1ce;cursor:pointer}.drawer .phase{font-size:10px;color:var(--blue);font-weight:800;letter-spacing:.12em}.drawer h2{font-size:19px;margin:5px 34px 8px 0}.drawer .summary{color:#8190a2;font-size:11px;line-height:1.5;margin-bottom:14px}.statusrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.drawer button.action{border:1px solid #293241;background:#0e131b;color:#b8c1ce;border-radius:9px;padding:8px 11px;cursor:pointer}.drawer button.action.active.doneBtn{border-color:#3c7c5d;background:#102219}.drawer button.action.active.pinBtn{border-color:#8b6d32;background:#211a0d}.fieldlabel{display:block;margin-top:13px;color:#687587;font-size:9px;font-weight:800;letter-spacing:.1em}.drawer input,.drawer textarea{width:100%;background:#090d13;color:#e7edf5;border:1px solid #273140;border-radius:8px;padding:8px;margin-top:6px;font:12px Inter,Segoe UI,Arial}.drawer textarea{min-height:72px;resize:vertical}.addref{width:100%;margin-top:8px}.ref-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ref-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:6px;background:#111722;color:#8fb5ef;font-size:10px;max-width:100%;overflow:hidden}.ref-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ref-chip button{border:0;background:transparent;color:#64758e;cursor:pointer;padding:0}.drawer small{display:block;color:#687587;margin-top:14px;line-height:1.45}.note-layer{position:absolute;inset:0;z-index:6;pointer-events:none}.sticky{position:absolute;width:190px;min-height:105px;background:#17130b;border:1px solid #5c4a24;border-radius:12px;box-shadow:0 14px 35px #0009;pointer-events:auto;user-select:none;overflow:hidden}.sticky.linked{border-color:#3b5278}.sticky-head{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 10px;cursor:grab;color:#c7a65e;font-size:10px;font-weight:800;letter-spacing:.08em;border-bottom:1px solid #302819}.sticky.linked .sticky-head{color:#82adf2;border-bottom-color:#23334c}.sticky textarea{width:100%;min-height:73px;border:0;outline:0;resize:both;background:transparent;color:#e8e1d0;padding:10px;font:12px/1.45 Inter,Segoe UI,Arial}.sticky-tools{display:flex;gap:3px}.sticky-tools button{border:0;background:transparent;color:#74664a;cursor:pointer;padding:3px 5px}.sticky-tools button:hover{color:#fff}.note-links{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}.connector{stroke:#4a6082;stroke-width:1.4;stroke-dasharray:5 5;opacity:.75}.board-tip{position:absolute;left:50%;top:20px;transform:translateX(-50%);z-index:7;color:#566273;font-size:10px;background:#090d13d9;border:1px solid #1d2530;border-radius:999px;padding:6px 10px;pointer-events:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.drawer{position:fixed;left:16px;right:16px;bottom:16px;top:auto;width:auto}.ref{display:none}.top{padding:0 14px}.top-action{display:none}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand"><b>LB WORKSPACE</b><span>Project plan navigator</span></div><div id="projects" class="project-list"></div><div class="side-foot">One UI · many project plans<br>Repository data remains authority.<br>Local marks and notes stay in this browser.</div></aside><main class="main"><header class="top"><div class="title"><b id="projectTitle">Loading…</b><span id="projectSub"></span></div><div class="top-right"><button class="top-action" id="clearPin">Clear pin</button><button class="top-action" id="resetMarks">Reset local marks</button><span class="counter" id="counter">—</span><span class="badge" id="mapState">—</span></div></header><div class="canvas" id="canvas"><div class="board" id="board"></div><div class="view-controls"><button id="zoomOut" title="Zoom out">−</button><span class="zoom-label" id="zoomLabel">100%</span><button id="zoomIn" title="Zoom in">+</button><button id="fitView" title="Fit plan">⌂</button></div><div class="view-hint">Drag empty canvas to pan · Mouse wheel / trackpad to zoom · Double-click empty plan space for note</div></div><div class="ref" id="refBox"></div><aside class="drawer" id="drawer"><button class="close" id="closeDrawer">×</button><div class="phase" id="dPhase"></div><h2 id="dTitle"></h2><div class="summary" id="dSummary"></div><div class="statusrow"><button class="action doneBtn" id="doneBtn">✓ Done</button><button class="action pinBtn" id="pinBtn">◆ Pin here</button></div><span class="fieldlabel">PHASE NOTE</span><textarea id="phaseNote" placeholder="Short local note for this phase"></textarea><span class="fieldlabel">REFERENCE</span><input id="refInput" placeholder="URL, file, commit, document, checkpoint…"><button class="action addref" id="addRef">Attach reference</button><div class="ref-list" id="refList"></div><small id="dDirection"></small></aside></main></div>
<script>
let registry={projects:[]},active=null,currentPlan=null,currentProject=null,selectedNodeId=null;
let view={x:70,y:45,scale:1},drag=null;
const MIN_ZOOM=.35,MAX_ZOOM=2.4,STORE_PREFIX='lb-workspace-plan-v3:';
const canvas=document.getElementById('canvas'),board=document.getElementById('board'),zoomLabel=document.getElementById('zoomLabel');
const drawer=document.getElementById('drawer'),counter=document.getElementById('counter');
function emptyState(){return{done:{},pin:null,notes:[],phaseNotes:{},refs:{}}}
function stateKey(){return STORE_PREFIX+(active||'none')}
function getState(){try{return{...emptyState(),...JSON.parse(localStorage.getItem(stateKey())||'{}')}}catch{return emptyState()}}
function putState(state){localStorage.setItem(stateKey(),JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function j(path){const r=await fetch(path+'?v='+Date.now());if(!r.ok)throw new Error(path);return r.json()}
async function load(){registry=await j('./projects.json');renderProjects();select(registry.projects[0]?.id)}
function renderProjects(){projects.innerHTML='';registry.projects.forEach(p=>{const b=document.createElement('button');b.className='project'+(active===p.id?' active':'');b.innerHTML=`${esc(p.name)}<small>${esc(p.subtitle||'')}</small>`;b.onclick=()=>select(p.id);projects.appendChild(b)})}
async function select(id){active=id;selectedNodeId=null;drawer.classList.remove('open');renderProjects();currentProject=registry.projects.find(x=>x.id===id);projectTitle.textContent=currentProject.name;projectSub.textContent=currentProject.subtitle||'';refBox.innerHTML=currentProject.reference?`Reference: <a href="${esc(currentProject.reference)}" target="_blank">open current project record</a>`:'';board.innerHTML='';resetView(false);currentPlan=null;if(!currentProject.mapped){mapState.textContent='PLAN NOT MAPPED';counter.textContent='—';board.innerHTML='<div class="empty"><b>Plan map not added yet</b><span>This project is visible in the workspace, but no canonical visual plan has been registered.</span></div>';return}mapState.textContent='PLAN MAPPED';try{currentPlan=await j(currentProject.plan_file);renderPlan();requestAnimationFrame(()=>fitPlan())}catch(e){board.innerHTML='<div class="empty"><b>Plan data unavailable</b><span>Check the project plan file in GPT-Knowledge.</span></div>'}}
function groupedNodes(nodes){const m=new Map();nodes.forEach(n=>{const lane=n.lane||'Plan';if(!m.has(lane))m.set(lane,[]);m.get(lane).push(n)});return [...m.entries()]}
function renderPlan(){if(!currentPlan)return;const state=getState();board.innerHTML='<svg class="note-links" id="noteLinks"></svg><div class="note-layer" id="noteLayer"></div><div class="board-tip">Local annotations only — repository plan data remains authoritative</div>';const lanes=document.createElement('div');lanes.className='lanes';const canonicalActive=currentPlan.active_node||currentProject.active_node;groupedNodes(currentPlan.nodes||[]).forEach(([laneName,nodes])=>{const lane=document.createElement('section');lane.className='lane';lane.innerHTML=`<div class="lane-label">${esc(laneName)}</div><div class="lane-nodes"></div>`;const wrap=lane.querySelector('.lane-nodes');nodes.forEach(n=>{const el=document.createElement('div');const localDone=!!state.done[n.id],pinned=state.pin===n.id;el.className='node '+(n.id===canonicalActive?'current ':((n.status||'')+' '))+(localDone?'local-done ':'')+(pinned?'pinned ':'');el.dataset.nodeId=n.id;el.innerHTML=`${pinned?'<span class="pin-dot">◆</span>':''}<div class="id">${esc(n.id)}</div><div class="name">${esc(n.title)}</div>`;el.title=n.summary||'';el.onclick=e=>{e.stopPropagation();openNode(n.id)};wrap.appendChild(el)});lanes.appendChild(lane)});board.appendChild(lanes);renderNotes();updateCounter();if(selectedNodeId)updateDrawer()}
function updateCounter(){if(!currentPlan){counter.textContent='—';return}const s=getState(),done=(currentPlan.nodes||[]).filter(n=>s.done[n.id]).length;counter.textContent=`${done} / ${(currentPlan.nodes||[]).length} local done`}
function nodeById(id){return(currentPlan?.nodes||[]).find(n=>n.id===id)}
function openNode(id){selectedNodeId=id;drawer.classList.add('open');updateDrawer()}
function updateDrawer(){const n=nodeById(selectedNodeId);if(!n)return;const s=getState();dPhase.textContent=n.id;dTitle.textContent=n.title;dSummary.textContent=n.summary||'';doneBtn.classList.toggle('active',!!s.done[n.id]);pinBtn.classList.toggle('active',s.pin===n.id);phaseNote.value=s.phaseNotes[n.id]||'';refInput.value='';renderRefs();const list=currentPlan.nodes||[],i=list.findIndex(x=>x.id===n.id),prev=i>0?list[i-1]:null,next=i>=0&&i<list.length-1?list[i+1]:null;dDirection.textContent=(prev?`← ${prev.id} ${prev.title}   `:'START   ')+(next?`→ ${next.id} ${next.title}`:'→ END')}
function renderRefs(){const s=getState(),refs=s.refs[selectedNodeId]||[];refList.innerHTML='';refs.forEach((r,i)=>{const chip=document.createElement('div');chip.className='ref-chip';chip.innerHTML=`<span title="${esc(r)}">${esc(r)}</span><button title="Remove">×</button>`;chip.querySelector('button').onclick=()=>{const next=getState();next.refs[selectedNodeId].splice(i,1);putState(next);renderRefs()};refList.appendChild(chip)})}
doneBtn.onclick=()=>{if(!selectedNodeId)return;const s=getState();s.done[selectedNodeId]=!s.done[selectedNodeId];putState(s);renderPlan()}
pinBtn.onclick=()=>{if(!selectedNodeId)return;const s=getState();s.pin=s.pin===selectedNodeId?null:selectedNodeId;putState(s);renderPlan()}
phaseNote.oninput=()=>{if(!selectedNodeId)return;const s=getState();s.phaseNotes[selectedNodeId]=phaseNote.value;putState(s)}
addRef.onclick=()=>{if(!selectedNodeId||!refInput.value.trim())return;const s=getState();s.refs[selectedNodeId]=s.refs[selectedNodeId]||[];s.refs[selectedNodeId].push(refInput.value.trim());putState(s);refInput.value='';renderRefs()}
closeDrawer.onclick=()=>drawer.classList.remove('open');
clearPin.onclick=()=>{if(!active)return;const s=getState();s.pin=null;putState(s);renderPlan()}
resetMarks.onclick=()=>{if(!active||!confirm('Clear local Done marks, pin, notes and attached references for this project?'))return;localStorage.removeItem(stateKey());selectedNodeId=null;drawer.classList.remove('open');renderPlan()}
canvas.addEventListener('dblclick',e=>{if(!currentPlan||e.target.closest('.node,.drawer,.sticky,.view-controls,button,input,textarea'))return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left-view.x)/view.scale,y=(e.clientY-r.top-view.y)/view.scale;const s=getState();s.notes.push({id:'n'+Date.now(),x:Math.max(0,x),y:Math.max(0,y),text:'',phase:selectedNodeId||null});putState(s);renderNotes()});
function renderNotes(){const layer=document.getElementById('noteLayer'),svg=document.getElementById('noteLinks');if(!layer||!svg)return;layer.innerHTML='';const s=getState();s.notes=s.notes||[];s.notes.forEach(note=>{const el=document.createElement('div');el.className='sticky'+(note.phase?' linked':'');el.dataset.id=note.id;el.style.left=note.x+'px';el.style.top=note.y+'px';el.innerHTML=`<div class="sticky-head"><span>${note.phase?esc(note.phase)+' REFERENCE':'NOTE'}</span><div class="sticky-tools"><button data-link title="Link to selected phase">◆</button><button data-del title="Delete">×</button></div></div><textarea placeholder="Write note / paste reference…">${esc(note.text||'')}</textarea>`;el.querySelector('textarea').oninput=ev=>{const st=getState(),n=st.notes.find(x=>x.id===note.id);if(n){n.text=ev.target.value;putState(st)}};el.querySelector('[data-del]').onclick=()=>{const st=getState();st.notes=st.notes.filter(x=>x.id!==note.id);putState(st);renderNotes()};el.querySelector('[data-link]').onclick=()=>{const st=getState(),n=st.notes.find(x=>x.id===note.id);if(n){n.phase=selectedNodeId||null;putState(st);renderNotes()}};let moving=false,ox=0,oy=0;const head=el.querySelector('.sticky-head');head.onpointerdown=ev=>{if(ev.target.tagName==='BUTTON')return;moving=true;head.setPointerCapture(ev.pointerId);ox=ev.clientX/view.scale-note.x;oy=ev.clientY/view.scale-note.y};head.onpointermove=ev=>{if(!moving)return;const cr=canvas.getBoundingClientRect();note.x=Math.max(0,(ev.clientX-cr.left-view.x)/view.scale-ox+view.x/view.scale);note.y=Math.max(0,(ev.clientY-cr.top-view.y)/view.scale-oy+view.y/view.scale);el.style.left=note.x+'px';el.style.top=note.y+'px';renderNoteLinks()};head.onpointerup=()=>{moving=false;const st=getState(),n=st.notes.find(x=>x.id===note.id);if(n){n.x=note.x;n.y=note.y;putState(st)}renderNoteLinks()};layer.appendChild(el)});renderNoteLinks()}
function renderNoteLinks(){const svg=document.getElementById('noteLinks');if(!svg)return;let lines='';const s=getState();(s.notes||[]).filter(n=>n.phase).forEach(note=>{const node=board.querySelector(`[data-node-id="${CSS.escape(note.phase)}"]`);if(!node)return;const br=board.getBoundingClientRect(),nr=node.getBoundingClientRect();const x1=(nr.left+nr.width/2-br.left)/view.scale,y1=(nr.top+nr.height/2-br.top)/view.scale,x2=note.x+95,y2=note.y+15;lines+=`<line class="connector" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`});svg.innerHTML=lines}
function applyView(){board.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;zoomLabel.textContent=Math.round(view.scale*100)+'%'}
function clampScale(s){return Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,s))}
function zoomAt(clientX,clientY,nextScale){const r=canvas.getBoundingClientRect(),sx=clientX-r.left,sy=clientY-r.top,worldX=(sx-view.x)/view.scale,worldY=(sy-view.y)/view.scale;view.scale=clampScale(nextScale);view.x=sx-worldX*view.scale;view.y=sy-worldY*view.scale;applyView()}
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,view.scale*Math.exp(-e.deltaY*.0015))},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node,.sticky,.view-controls'))return;drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,x:view.x,y:view.y};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;view.x=drag.x+(e.clientX-drag.startX);view.y=drag.y+(e.clientY-drag.startY);applyView()});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;drag=null;canvas.classList.remove('dragging')}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
zoomIn.onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,view.scale*1.18)};zoomOut.onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,view.scale/1.18)};fitView.onclick=()=>fitPlan();
function fitPlan(){const r=canvas.getBoundingClientRect(),contentW=Math.max(board.scrollWidth,900),contentH=Math.max(board.scrollHeight,540),s=clampScale(Math.min((r.width-90)/contentW,(r.height-90)/contentH,1.15));view.scale=s;view.x=(r.width-contentW*s)/2;view.y=(r.height-contentH*s)/2;applyView();requestAnimationFrame(renderNoteLinks)}
function resetView(apply=true){view={x:70,y:45,scale:1};if(apply)applyView()}
window.addEventListener('resize',()=>{if(active)fitPlan()});
load().catch(e=>{projectTitle.textContent='Workspace unavailable';projectSub.textContent=String(e)})
</script></body></html>
