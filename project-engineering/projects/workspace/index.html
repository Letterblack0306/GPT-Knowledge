<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letterblack Project Workspace</title>
<style>
:root{--bg:#080a0e;--panel:#0d1117;--panel2:#121821;--line:#222b37;--text:#eef3f8;--muted:#778392;--blue:#7da9ff;--green:#65d29a;--amber:#f0bd63}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.4 Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.app{display:grid;grid-template-columns:240px 1fr;height:100%}.side{border-right:1px solid var(--line);background:#090c11;padding:18px 14px;display:flex;flex-direction:column}.brand{padding:8px 10px 18px}.brand b{font-size:15px;letter-spacing:.08em}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.project-list{display:flex;flex-direction:column;gap:7px}.project{border:1px solid transparent;background:transparent;color:#aeb8c4;border-radius:10px;padding:11px;text-align:left;cursor:pointer}.project:hover{background:#0f141b}.project.active{background:#121923;border-color:#2d3a4b;color:#fff}.project small{display:block;color:#667384;margin-top:3px}.side-foot{margin-top:auto;color:#526071;font-size:10px;padding:10px}.main{position:relative;overflow:hidden}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0a0d12}.title b{font-size:17px}.title span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.canvas{position:absolute;left:0;right:0;top:70px;bottom:0;overflow:auto;background:radial-gradient(circle at 50% 42%,#111927 0,transparent 34%),linear-gradient(#0b0f14 1px,transparent 1px),linear-gradient(90deg,#0b0f14 1px,transparent 1px);background-size:auto,42px 42px,42px 42px}.board{position:relative;min-width:1250px;min-height:720px;padding:80px 60px}.road{display:flex;align-items:center;gap:26px;flex-wrap:wrap}.node{width:138px;height:138px;border-radius:50%;border:1px solid #303948;background:#0e131a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 12px 35px #0007;position:relative;cursor:pointer}.node .id{font-size:10px;color:#6b7889;font-weight:700;letter-spacing:.08em}.node .name{font-size:12px;font-weight:650;margin-top:5px;max-width:100px}.node.proven{border-color:#35634e}.node.current{border-color:var(--blue);box-shadow:0 0 0 5px #7da9ff12,0 12px 35px #0007}.node.current:before{content:'YOU ARE HERE';position:absolute;top:-27px;font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--blue)}.node.next{border-color:#6b5530}.empty{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;color:var(--muted)}.empty b{display:block;color:#cbd3dc;font-size:18px;margin-bottom:6px}.ref{position:absolute;right:22px;top:92px;background:#0c1118e8;border:1px solid #283240;border-radius:12px;padding:10px 12px;color:#8b98a8;font-size:11px;max-width:320px}.ref a{color:#8db7ff}.badge{border:1px solid #283240;border-radius:999px;padding:5px 8px;color:#778392;font-size:10px}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand"><b>LB WORKSPACE</b><span>Project plan navigator</span></div><div id="projects" class="project-list"></div><div class="side-foot">One UI · many project plans<br>Repository data remains authority.</div></aside><main class="main"><header class="top"><div class="title"><b id="projectTitle">Loading…</b><span id="projectSub"></span></div><span class="badge" id="mapState">—</span></header><div class="canvas"><div class="board" id="board"></div></div><div class="ref" id="refBox"></div></main></div>
<script>
let registry={projects:[]},active=null;
async function j(path){const r=await fetch(path+'?v='+Date.now());if(!r.ok)throw new Error(path);return r.json()}
async function load(){registry=await j('./projects.json');renderProjects();select(registry.projects[0]?.id)}
function renderProjects(){projects.innerHTML='';registry.projects.forEach(p=>{const b=document.createElement('button');b.className='project'+(active===p.id?' active':'');b.innerHTML=`${p.name}<small>${p.subtitle||''}</small>`;b.onclick=()=>select(p.id);projects.appendChild(b)})}
async function select(id){active=id;renderProjects();const p=registry.projects.find(x=>x.id===id);projectTitle.textContent=p.name;projectSub.textContent=p.subtitle||'';refBox.innerHTML=p.reference?`Reference: <a href="${p.reference}" target="_blank">open current project record</a>`:'';board.innerHTML='';if(!p.mapped){mapState.textContent='PLAN NOT MAPPED';board.innerHTML='<div class="empty"><b>Plan map not added yet</b><span>This project is visible in the workspace, but no canonical visual plan has been registered.</span></div>';return}mapState.textContent='PLAN MAPPED';try{const plan=await j(p.plan_file);renderPlan(plan,p)}catch(e){board.innerHTML='<div class="empty"><b>Plan data unavailable</b><span>Check the project plan file in GPT-Knowledge.</span></div>'}}
function renderPlan(plan,p){const road=document.createElement('div');road.className='road';const activeNode=plan.active_node||p.active_node;const nodes=plan.nodes||[];nodes.forEach(n=>{const el=document.createElement('div');el.className='node '+(n.id===activeNode?'current':n.status||'');el.innerHTML=`<div class="id">${n.id}</div><div class="name">${n.title}</div>`;el.title=n.summary||'';road.appendChild(el)});board.appendChild(road)}
load().catch(e=>{projectTitle.textContent='Workspace unavailable';projectSub.textContent=String(e)})
</script></body></html>
