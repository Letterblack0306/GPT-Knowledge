<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letterblack Project Workspace</title>
<style>
:root{--bg:#080a0e;--panel:#0d1117;--panel2:#121821;--line:#222b37;--text:#eef3f8;--muted:#778392;--blue:#7da9ff;--green:#65d29a;--amber:#f0bd63}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.4 Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.app{display:grid;grid-template-columns:240px 1fr;height:100%}.side{border-right:1px solid var(--line);background:#090c11;padding:18px 14px;display:flex;flex-direction:column}.brand{padding:8px 10px 18px}.brand b{font-size:15px;letter-spacing:.08em}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.project-list{display:flex;flex-direction:column;gap:7px}.project{border:1px solid transparent;background:transparent;color:#aeb8c4;border-radius:10px;padding:11px;text-align:left;cursor:pointer}.project:hover{background:#0f141b}.project.active{background:#121923;border-color:#2d3a4b;color:#fff}.project small{display:block;color:#667384;margin-top:3px}.side-foot{margin-top:auto;color:#526071;font-size:10px;padding:10px}.main{position:relative;overflow:hidden}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0a0d12}.title b{font-size:17px}.title span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.top-right{display:flex;align-items:center;gap:9px}.canvas{position:absolute;left:0;right:0;top:70px;bottom:0;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(circle at 50% 42%,#111927 0,transparent 34%),linear-gradient(#0b0f14 1px,transparent 1px),linear-gradient(90deg,#0b0f14 1px,transparent 1px);background-size:auto,42px 42px,42px 42px}.canvas.dragging{cursor:grabbing}.board{position:absolute;left:0;top:0;width:1250px;min-height:720px;padding:80px 60px;transform-origin:0 0;will-change:transform}.road{display:flex;align-items:center;gap:26px;flex-wrap:wrap}.node{width:138px;height:138px;border-radius:50%;border:1px solid #303948;background:#0e131a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 12px 35px #0007;position:relative;cursor:pointer;user-select:none}.node .id{font-size:10px;color:#6b7889;font-weight:700;letter-spacing:.08em}.node .name{font-size:12px;font-weight:650;margin-top:5px;max-width:100px}.node.proven{border-color:#35634e}.node.current{border-color:var(--blue);box-shadow:0 0 0 5px #7da9ff12,0 12px 35px #0007}.node.current:before{content:'YOU ARE HERE';position:absolute;top:-27px;font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--blue)}.node.next{border-color:#6b5530}.empty{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;color:var(--muted)}.empty b{display:block;color:#cbd3dc;font-size:18px;margin-bottom:6px}.ref{position:absolute;right:22px;top:92px;background:#0c1118e8;border:1px solid #283240;border-radius:12px;padding:10px 12px;color:#8b98a8;font-size:11px;max-width:320px}.ref a{color:#8db7ff}.badge{border:1px solid #283240;border-radius:999px;padding:5px 8px;color:#778392;font-size:10px}.view-controls{position:absolute;left:18px;bottom:18px;z-index:8;display:flex;align-items:center;gap:6px;padding:6px;background:#0a0e14dd;border:1px solid #25303d;border-radius:12px;backdrop-filter:blur(10px)}.view-controls button{width:32px;height:30px;border:1px solid #283442;background:#111721;color:#b8c5d4;border-radius:8px;cursor:pointer}.view-controls button:hover{border-color:#52647a;color:#fff}.zoom-label{min-width:46px;text-align:center;color:#7f8b99;font-size:10px;font-weight:700}.view-hint{position:absolute;left:50%;bottom:21px;transform:translateX(-50%);z-index:7;color:#566273;font-size:10px;pointer-events:none;background:#090d13b8;border:1px solid #1d2530;border-radius:999px;padding:5px 9px}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand"><b>LB WORKSPACE</b><span>Project plan navigator</span></div><div id="projects" class="project-list"></div><div class="side-foot">One UI · many project plans<br>Repository data remains authority.</div></aside><main class="main"><header class="top"><div class="title"><b id="projectTitle">Loading…</b><span id="projectSub"></span></div><div class="top-right"><span class="badge" id="mapState">—</span></div></header><div class="canvas" id="canvas"><div class="board" id="board"></div><div class="view-controls"><button id="zoomOut" title="Zoom out">−</button><span class="zoom-label" id="zoomLabel">100%</span><button id="zoomIn" title="Zoom in">+</button><button id="fitView" title="Fit plan">⌂</button></div><div class="view-hint">Drag empty canvas to pan · Mouse wheel / trackpad to zoom</div></div><div class="ref" id="refBox"></div></main></div>
<script>
let registry={projects:[]},active=null;
let view={x:70,y:45,scale:1},drag=null;
const MIN_ZOOM=.35,MAX_ZOOM=2.4;
const canvas=document.getElementById('canvas'),board=document.getElementById('board'),zoomLabel=document.getElementById('zoomLabel');
async function j(path){const r=await fetch(path+'?v='+Date.now());if(!r.ok)throw new Error(path);return r.json()}
async function load(){registry=await j('./projects.json');renderProjects();select(registry.projects[0]?.id)}
function renderProjects(){projects.innerHTML='';registry.projects.forEach(p=>{const b=document.createElement('button');b.className='project'+(active===p.id?' active':'');b.innerHTML=`${p.name}<small>${p.subtitle||''}</small>`;b.onclick=()=>select(p.id);projects.appendChild(b)})}
async function select(id){active=id;renderProjects();const p=registry.projects.find(x=>x.id===id);projectTitle.textContent=p.name;projectSub.textContent=p.subtitle||'';refBox.innerHTML=p.reference?`Reference: <a href="${p.reference}" target="_blank">open current project record</a>`:'';board.innerHTML='';resetView(false);if(!p.mapped){mapState.textContent='PLAN NOT MAPPED';board.innerHTML='<div class="empty"><b>Plan map not added yet</b><span>This project is visible in the workspace, but no canonical visual plan has been registered.</span></div>';return}mapState.textContent='PLAN MAPPED';try{const plan=await j(p.plan_file);renderPlan(plan,p);requestAnimationFrame(()=>fitPlan())}catch(e){board.innerHTML='<div class="empty"><b>Plan data unavailable</b><span>Check the project plan file in GPT-Knowledge.</span></div>'}}
function renderPlan(plan,p){const road=document.createElement('div');road.className='road';const activeNode=plan.active_node||p.active_node;const nodes=plan.nodes||[];nodes.forEach(n=>{const el=document.createElement('div');el.className='node '+(n.id===activeNode?'current':n.status||'');el.innerHTML=`<div class="id">${n.id}</div><div class="name">${n.title}</div>`;el.title=n.summary||'';road.appendChild(el)});board.appendChild(road)}
function applyView(){board.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;zoomLabel.textContent=Math.round(view.scale*100)+'%'}
function clampScale(s){return Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,s))}
function zoomAt(clientX,clientY,nextScale){const r=canvas.getBoundingClientRect();const sx=clientX-r.left,sy=clientY-r.top;const worldX=(sx-view.x)/view.scale,worldY=(sy-view.y)/view.scale;view.scale=clampScale(nextScale);view.x=sx-worldX*view.scale;view.y=sy-worldY*view.scale;applyView()}
canvas.addEventListener('wheel',e=>{e.preventDefault();const factor=Math.exp(-e.deltaY*.0015);zoomAt(e.clientX,e.clientY,view.scale*factor)},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node,.view-controls'))return;drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,x:view.x,y:view.y};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;view.x=drag.x+(e.clientX-drag.startX);view.y=drag.y+(e.clientY-drag.startY);applyView()});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;drag=null;canvas.classList.remove('dragging')}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
zoomIn.onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,view.scale*1.18)};
zoomOut.onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,view.scale/1.18)};
fitView.onclick=()=>fitPlan();
function fitPlan(){const r=canvas.getBoundingClientRect();const contentW=Math.max(board.scrollWidth,900),contentH=Math.max(board.scrollHeight,540);const s=clampScale(Math.min((r.width-90)/contentW,(r.height-90)/contentH,1.15));view.scale=s;view.x=(r.width-contentW*s)/2;view.y=(r.height-contentH*s)/2;applyView()}
function resetView(apply=true){view={x:70,y:45,scale:1};if(apply)applyView()}
window.addEventListener('resize',()=>{if(active)fitPlan()});
load().catch(e=>{projectTitle.textContent='Workspace unavailable';projectSub.textContent=String(e)})
</script></body></html>
