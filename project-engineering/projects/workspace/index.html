<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letterblack Project Workspace</title>
<style>
:root{--bg:#080a0e;--panel:#0d1117;--panel2:#121821;--line:#222b37;--text:#eef3f8;--muted:#778392;--blue:#7da9ff;--green:#65d29a;--amber:#f0bd63;--red:#ef7f7f;--purple:#b79cff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px/1.45 Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.app{display:grid;grid-template-columns:230px 1fr 340px;height:100%}.side{border-right:1px solid var(--line);background:#090c11;padding:18px 14px;display:flex;flex-direction:column}.brand{padding:7px 10px 18px}.brand b{font-size:15px;letter-spacing:.08em}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.project-list{display:flex;flex-direction:column;gap:7px}.project{border:1px solid transparent;background:transparent;color:#aeb8c4;border-radius:10px;padding:11px;text-align:left;cursor:pointer}.project:hover{background:#0f141b}.project.active{background:#121923;border-color:#2d3a4b;color:#fff}.project small{display:block;color:#667384;margin-top:3px}.side-foot{margin-top:auto;color:#526071;font-size:10px;padding:10px}.main{position:relative;overflow:hidden}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0a0d12}.title b{font-size:17px}.title span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.badges{display:flex;gap:7px;align-items:center}.badge{border:1px solid #283240;border-radius:999px;padding:5px 8px;color:#8794a4;font-size:9px}.badge.current{border-color:#526f9b;color:#9fc1ff}.canvas{position:absolute;inset:70px 0 0;overflow:auto;background:radial-gradient(circle at 50% 25%,#111927 0,transparent 32%),linear-gradient(#0b0f14 1px,transparent 1px),linear-gradient(90deg,#0b0f14 1px,transparent 1px);background-size:auto,40px 40px,40px 40px}.board{position:relative;min-width:1220px;min-height:820px;padding:54px 42px 100px}.lanes{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;position:relative;z-index:2}.lane{min-width:240px;max-width:360px;flex:1 1 270px;border:1px solid #171e28;border-radius:18px;background:#0b0f15cc;padding:15px}.lane-label{color:#4f5d6e;font-size:9px;letter-spacing:.15em;font-weight:800;margin:0 3px 13px;text-transform:uppercase}.lane-nodes{display:flex;gap:12px;flex-wrap:wrap}.node{width:132px;min-height:112px;border-radius:14px;border:1px solid #303948;background:#0e131a;padding:13px;position:relative;cursor:pointer;box-shadow:0 10px 26px #0006}.node:hover{border-color:#607086}.node .id{font-size:8px;color:#697688;font-weight:700;letter-spacing:.06em}.node .name{font-size:11px;font-weight:700;margin-top:5px}.node .priority{font-size:8px;color:#adbac8;margin-top:7px}.node.proven{border-color:#35634e;background:#0f1714}.node.historical{border-color:#524b75;background:#13121c}.node.current{border-color:var(--blue);box-shadow:0 0 0 4px #7da9ff12,0 10px 26px #0006}.node.current:before{content:'CURRENT GATE';position:absolute;top:-18px;left:7px;font-size:7px;font-weight:900;letter-spacing:.1em;color:var(--blue)}.node.next{border-color:#6b5530;background:#17140f}.node.warning{border-color:#704545;background:#191111}.edge-layer{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.edge{stroke:#39485c;stroke-width:1.5;fill:none;opacity:.8}.edge.acceptance{stroke:#8c6841;stroke-dasharray:6 5}.edge.historical-proof{stroke:#5a527c;stroke-dasharray:4 4}.edge.requires-revalidation{stroke:#7da9ff;stroke-dasharray:7 4}.edge.validation-boundary,.edge.test-recheck{stroke:#754949;stroke-dasharray:3 4}.status{border-left:1px solid var(--line);background:#090c11;overflow:auto;padding:18px 16px}.status h2{font-size:14px;margin:0 0 4px}.status .sub{font-size:10px;color:var(--muted);margin-bottom:14px}.status-card{border:1px solid #202a36;border-radius:12px;background:#0d1219;padding:12px;margin-bottom:10px}.status-card h3{font-size:11px;margin:0 0 5px}.status-card p{font-size:10px;color:#8794a4;margin:0}.status-card.pending{border-color:#5e472b}.status-card.closed{border-color:#2d5a44}.status-card.history{border-color:#4d466b}.status-card .meta{font-size:8px;letter-spacing:.08em;color:#6d7b8c;margin-bottom:5px;text-transform:uppercase}.gate{border:1px solid #38537b;background:#0d1520;border-radius:13px;padding:13px;margin-bottom:14px}.gate b{font-size:11px}.gate p{font-size:10px;color:#9eb0c5;margin:6px 0 0}.drawer{position:fixed;right:360px;top:88px;width:330px;border:1px solid #2a3543;border-radius:14px;background:#0c1118f7;padding:16px;box-shadow:0 24px 70px #000a;display:none;z-index:10}.drawer.open{display:block}.drawer button{float:right;border:0;background:transparent;color:#8a97a7;cursor:pointer;font-size:18px}.drawer .phase{font-size:9px;color:var(--blue);font-weight:800}.drawer h3{margin:4px 0 8px;font-size:17px}.drawer p{color:#8b99aa;font-size:11px}.drawer .relations{margin-top:12px;border-top:1px solid #222c38;padding-top:10px;font-size:10px;color:#748295}.empty{padding:60px;color:#7f8b99;text-align:center}@media(max-width:1100px){.app{grid-template-columns:210px 1fr}.status{display:none}.drawer{right:18px}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.drawer{left:12px;right:12px;width:auto}.board{min-width:900px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><b>LB WORKSPACE</b><span>Repository-driven project truth</span></div><div id="projects" class="project-list"></div><div class="side-foot">Plan + status JSON drive this UI.<br>Refresh reads repository-deployed data again.</div></aside>
  <main class="main"><header class="top"><div class="title"><b id="projectTitle">Loading…</b><span id="projectSub"></span></div><div class="badges"><span class="badge" id="headBadge">HEAD —</span><span class="badge current" id="classBadge">—</span></div></header><div class="canvas"><div class="board" id="board"></div></div></main>
  <aside class="status"><h2>Current state</h2><div class="sub" id="verifiedAt">No status data</div><div id="statusContent"></div></aside>
</div>
<aside class="drawer" id="drawer"><button id="closeDrawer">×</button><div class="phase" id="dPhase"></div><h3 id="dTitle"></h3><p id="dSummary"></p><div class="relations" id="dRelations"></div></aside>
<script>
let registry={projects:[]},currentProject=null,currentPlan=null,currentStatus=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function j(path){const r=await fetch(path+(path.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(`${path}: ${r.status}`);return r.json()}
async function load(){registry=await j('./projects.json');renderProjects();const preferred=location.hash.slice(1)||registry.projects[0]?.id;if(preferred)selectProject(preferred)}
function renderProjects(){const el=$('projects');el.innerHTML='';registry.projects.forEach(p=>{const b=document.createElement('button');b.className='project'+(currentProject?.id===p.id?' active':'');b.innerHTML=`${esc(p.name)}<small>${esc(p.subtitle||'')}</small>`;b.onclick=()=>selectProject(p.id);el.appendChild(b)})}
async function selectProject(id){currentProject=registry.projects.find(p=>p.id===id)||registry.projects[0];if(!currentProject)return;location.hash=currentProject.id;renderProjects();$('projectTitle').textContent=currentProject.name;$('projectSub').textContent=currentProject.subtitle||'';currentPlan=null;currentStatus=null;$('board').innerHTML='<div class="empty">Loading project data…</div>';
  if(!currentProject.mapped){$('board').innerHTML='<div class="empty">No visual plan registered for this project.</div>';renderStatus();return}
  const [plan,status]=await Promise.all([j(currentProject.plan_file),currentProject.status_file?j(currentProject.status_file).catch(()=>null):Promise.resolve(null)]);currentPlan=plan;currentStatus=status;renderPlan();renderStatus();requestAnimationFrame(drawEdges)}
function grouped(nodes){const m=new Map();(nodes||[]).forEach(n=>{const k=n.lane||'Plan';if(!m.has(k))m.set(k,[]);m.get(k).push(n)});return [...m.entries()]}
function edgeObj(e){return Array.isArray(e)?{from:e[0],to:e[1],type:'flow'}:e}
function renderPlan(){const board=$('board');board.innerHTML='<svg class="edge-layer" id="edgeLayer"></svg><div class="lanes" id="lanes"></div>';const lanes=$('lanes');const active=currentPlan.active_node||currentProject.active_node;grouped(currentPlan.nodes).forEach(([name,nodes])=>{const lane=document.createElement('section');lane.className='lane';lane.innerHTML=`<div class="lane-label">${esc(name)}</div><div class="lane-nodes"></div>`;const wrap=lane.querySelector('.lane-nodes');nodes.forEach(n=>{const card=document.createElement('div');card.className=`node ${esc(n.id===active?'current':(n.status||''))}`;card.dataset.nodeId=n.id;card.innerHTML=`<div class="id">${esc(n.id)}</div><div class="name">${esc(n.title)}</div>${n.priority?`<div class="priority">${esc(n.priority)}</div>`:''}`;card.title=n.summary||'';card.onclick=()=>openNode(n.id);wrap.appendChild(card)});lanes.appendChild(lane)});window.addEventListener('resize',drawEdges,{once:true})}
function drawEdges(){if(!currentPlan)return;const svg=$('edgeLayer'),board=$('board');if(!svg)return;const br=board.getBoundingClientRect();let out='<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#50617a"/></marker></defs>';(currentPlan.edges||[]).map(edgeObj).forEach(e=>{const a=board.querySelector(`[data-node-id="${CSS.escape(e.from)}"]`),b=board.querySelector(`[data-node-id="${CSS.escape(e.to)}"]`);if(!a||!b)return;const ar=a.getBoundingClientRect(),rr=b.getBoundingClientRect();const x1=ar.right-br.left,y1=ar.top+ar.height/2-br.top,x2=rr.left-br.left,y2=rr.top+rr.height/2-br.top;const bend=Math.max(30,Math.abs(x2-x1)*.42);out+=`<path class="edge ${esc(e.type||'flow')}" d="M ${x1} ${y1} C ${x1+bend} ${y1}, ${x2-bend} ${y2}, ${x2} ${y2}" marker-end="url(#arrow)"/>`});svg.innerHTML=out}
function openNode(id){const n=(currentPlan.nodes||[]).find(x=>x.id===id);if(!n)return;$('drawer').classList.add('open');$('dPhase').textContent=n.id;$('dTitle').textContent=n.title;$('dSummary').textContent=n.summary||'';const incoming=(currentPlan.edges||[]).map(edgeObj).filter(e=>e.to===id),outgoing=(currentPlan.edges||[]).map(edgeObj).filter(e=>e.from===id);$('dRelations').innerHTML=`<b>Connections</b><br>${incoming.length?`← ${incoming.map(e=>esc(e.from)).join(', ')}`:'← none'}<br>${outgoing.length?`→ ${outgoing.map(e=>esc(e.to)).join(', ')}`:'→ none'}`}
$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');
function cards(items,kind){return(items||[]).map(x=>`<div class="status-card ${kind}"><div class="meta">${esc(x.priority||x.classification||kind)}</div><h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p></div>`).join('')}
function renderStatus(){const root=$('statusContent');if(!currentStatus){$('verifiedAt').textContent='No project status file registered';$('headBadge').textContent='HEAD —';$('classBadge').textContent='PLAN ONLY';root.innerHTML='<div class="status-card"><p>This project currently exposes plan data only.</p></div>';return}$('verifiedAt').textContent=`Verified projection: ${currentStatus.verified_at||'unknown'}`;$('headBadge').textContent=`HEAD ${(currentStatus.source_head||'—').slice(0,8)}`;$('classBadge').textContent=currentStatus.overall_classification||'—';let html='';if(currentStatus.next_acceptance){html+=`<div class="gate"><b>Next acceptance question</b><p>${esc(currentStatus.next_acceptance.question)}</p></div>`}html+='<h2>Pending</h2>'+cards(currentStatus.pending,'pending');html+='<h2>Closed / current source</h2>'+cards(currentStatus.closed,'closed');html+='<h2>Historical proof</h2>'+cards(currentStatus.supported_historical,'history');root.innerHTML=html}
window.addEventListener('resize',()=>requestAnimationFrame(drawEdges));
load().catch(e=>{$('projectTitle').textContent='Workspace unavailable';$('projectSub').textContent=String(e);$('board').innerHTML='<div class="empty">Failed to load project data.</div>'})
</script>
<script src="./workspace-text-ui.js"></script>
</body></html>
