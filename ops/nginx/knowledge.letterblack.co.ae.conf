# ---------------------------------------------------------------------------
# Edge reverse proxy for knowledge.letterblack.co.ae
# Host (edge)  : public VPS 84.235.251.204  -- TLS terminates here
# Backend      : Ubuntu host behind WireGuard 10.10.0.4:8080
#   (The Ubuntu service MUST bind 10.10.0.4:8080 only -- NOT 0.0.0.0 --
#    and UFW MUST restrict :8080 ingress to the wg0 peer. See allowlist.json)
# Security model:
#   * UI + project JSON : public, READ-ONLY, no auth  ("no blocker for UI access")
#   * /api , /ws , and any execution endpoint : DENIED at the edge (403)
# TLS: certbot --nginx -d knowledge.letterblack.co.ae  (Let's Encrypt)
# Apply: copy here to /etc/nginx/sites-available/ , symlink into
#        sites-enabled, then `nginx -t && systemctl reload nginx`.
# ---------------------------------------------------------------------------

# Map: only GET/HEAD are permitted to read-only resources; everything else -> 1.
map $request_method $is_read_method {
    default 0;
    GET 1;
    HEAD 1;
}

# Redirect all HTTP -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name knowledge.letterblack.co.ae;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name knowledge.letterblack.co.ae;

    # --- TLS (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/knowledge.letterblack.co.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowledge.letterblack.co.ae/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1h;
    server_tokens        off;

    # --- Hard boundary: execution / dynamic surfaces are DENIED at the edge ---
    # /ws/*        -- WebSocket execution channel (not exposed here)
    # /api/*       -- execution surface (auth-gated on the backend, blocked here)
    # /run,/exec,/execute,/shell,/cmd,/terminal -- common shell/exec prefixes
    location /ws/                                             { return 403; }
    location /api/                                              { return 403; }
    location ~ ^/(run|exec|execute|shell|cmd|terminal)/ { return 403; }

    # --- Read-only allowlist: project JSON, GET/HEAD only ---
    #   e.g. https://knowledge.letterblack.co.ae/project-engineering/projects/workspace/projects.json
    location ~ ^/project-engineering/projects/.*\.json$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://10.10.0.4:8080;
    }

    # --- Read-only allowlist: static UI assets ---
    location ~* \.(?:js|css|map|png|jpg|jpeg|webp|svg|woff2?|ico)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://10.10.0.4:8080;
        add_header Cache-Control "public, max-age=300";
    }

    # --- Everything else: static UI shell (public read-only) ---
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://10.10.0.4:8080;
    }

    # --- Shared proxy headers (preserves caller identity to backend) ---
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}
